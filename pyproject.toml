[project]
name = "countdown"
version = "0.1.0"
description = "Countdown anagram and arithmetic puzzle solver"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "PLC", "PLE", "PLR", "PLW"]
ignore = ["E501", "E741"]

[tool.ty.environment]
python = ".venv"

[tool.ty.rules]
