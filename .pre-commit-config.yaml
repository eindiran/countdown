---
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.18"
    hooks:
      # Formatter
      - id: ruff-format
      # Linter
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: "v0.0.51"
    hooks:
      - id: ty
        args: [--python, .venv]
